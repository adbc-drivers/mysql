# Substrait dialect (https://github.com/substrait-io/substrait/blob/main/text/dialect_schema.yaml)
# describing the plans the driver's Substrait-to-SQL translator (substrait.go)
# accepts. Keep it in sync with the translator.
#
# Only a ReadRel over a NamedTable is supported, with emit but without
# filters or a projection. The translator uses no expressions, but the schema
# treats an empty or missing supported_expressions as "all expressions", so it
# can't be declared here; plans with ReadRel filters are rejected with
# ADBC_STATUS_NOT_IMPLEMENTED. Types only describe base_schema columns: there
# are no literals, and nested (struct, list and map) columns are not supported.

name: "ADBC MySQL Driver"
supported_types:
- "BOOL"
- "I8"
- "I16"
- "I32"
- "I64"
- "FP32"
- "FP64"
- "BINARY"
- "FIXED_BINARY"
- "STRING"
- "VARCHAR"
- "FIXED_CHAR"
- "DECIMAL"
- "DATE"
- type: "PRECISION_TIME"
  max_precision: 6
- type: "PRECISION_TIMESTAMP"
  max_precision: 6
- type: "PRECISION_TIMESTAMP_TZ"
  max_precision: 6
supported_relations:
- relation: "READ"
  read_types:
  - "NAMED_TABLE"
